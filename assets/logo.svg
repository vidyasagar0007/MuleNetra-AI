<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4C8DFF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#9270FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27D69B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#121C2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080D18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 8)">
    <!-- Hexagonal Security Shield -->
    <polygon points="36,4 68,22 68,54 36,72 4,54 4,22" fill="url(#shieldGrad)" stroke="url(#primaryGrad)" stroke-width="2.2" />
    
    <!-- Directed Money Movement Graph Lines -->
    <line x1="22" y1="30" x2="36" y2="18" stroke="#4C8DFF" stroke-width="1.6" opacity="0.85" />
    <line x1="36" y1="18" x2="50" y2="30" stroke="#9270FF" stroke-width="1.6" opacity="0.85" />
    <line x1="22" y1="30" x2="26" y2="50" stroke="#4C8DFF" stroke-width="1.6" opacity="0.85" />
    <line x1="50" y1="30" x2="46" y2="50" stroke="#9270FF" stroke-width="1.6" opacity="0.85" />
    <line x1="26" y1="50" x2="36" y2="60" stroke="#27D69B" stroke-width="1.6" opacity="0.85" />
    <line x1="46" y1="50" x2="36" y2="60" stroke="#27D69B" stroke-width="1.6" opacity="0.85" />
    <line x1="22" y1="30" x2="50" y2="30" stroke="#F5B942" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.75" />

    <!-- Center Sentinel Node -->
    <circle cx="36" cy="38" r="7.5" fill="#080D18" stroke="#FF5B6E" stroke-width="2" />
    <circle cx="36" cy="38" r="3.2" fill="#FF5B6E" />

    <!-- Network Vertices -->
    <circle cx="36" cy="18" r="3.8" fill="#4C8DFF" />
    <circle cx="22" cy="30" r="3.5" fill="#4C8DFF" />
    <circle cx="50" cy="30" r="3.5" fill="#9270FF" />
    <circle cx="26" cy="50" r="3.5" fill="#27D69B" />
    <circle cx="46" cy="50" r="3.5" fill="#9270FF" />
    <circle cx="36" cy="60" r="3.8" fill="#27D69B" />
  </g>

  <!-- Typography -->
  <text x="96" y="46" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="-0.5">
    MuleTrace<tspan fill="url(#primaryGrad)">.AI</tspan>
  </text>
  <text x="97" y="66" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#94A3B8" letter-spacing="1.4">
    FINANCIAL CRIME INTELLIGENCE
  </text>
</svg>
