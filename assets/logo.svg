<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Shield Background -->
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="#0F172A" stroke="url(#grad1)" stroke-width="2.5" />
    
    <!-- Network Graph Nodes & Links -->
    <line x1="25" y1="35" x2="40" y2="22" stroke="#38BDF8" stroke-width="1.8" opacity="0.8" />
    <line x1="40" y1="22" x2="55" y2="35" stroke="#6366F1" stroke-width="1.8" opacity="0.8" />
    <line x1="25" y1="35" x2="30" y2="60" stroke="#818CF8" stroke-width="1.8" opacity="0.8" />
    <line x1="55" y1="35" x2="50" y2="60" stroke="#A855F7" stroke-width="1.8" opacity="0.8" />
    <line x1="30" y1="60" x2="40" y2="70" stroke="#C084FC" stroke-width="1.8" opacity="0.8" />
    <line x1="50" y1="60" x2="40" y2="70" stroke="#38BDF8" stroke-width="1.8" opacity="0.8" />
    <line x1="25" y1="35" x2="55" y2="35" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.6" />

    <!-- Center Pulse Alert -->
    <circle cx="40" cy="45" r="9" fill="#0F172A" stroke="#F43F5E" stroke-width="2" filter="url(#glow)" />
    <circle cx="40" cy="45" r="4" fill="#F43F5E" />

    <!-- Outer Nodes -->
    <circle cx="40" cy="22" r="4.5" fill="#38BDF8" />
    <circle cx="25" cy="35" r="4" fill="#60A5FA" />
    <circle cx="55" cy="35" r="4" fill="#818CF8" />
    <circle cx="30" cy="60" r="4" fill="#A855F7" />
    <circle cx="50" cy="60" r="4" fill="#C084FC" />
    <circle cx="40" cy="70" r="4.5" fill="#E879F9" />
  </g>

  <!-- Typography -->
  <text x="105" y="52" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="32" fill="#F8FAFC" letter-spacing="-0.5">
    MuleTrace<tspan fill="url(#grad1)">.AI</tspan>
  </text>
  <text x="106" y="74" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94A3B8" letter-spacing="1.5">
    FINANCIAL CRIME INTELLIGENCE
  </text>
</svg>
